# 服务端口
server.port=8080

# 数据库配置（MySQL 5.7）—— 请改成你自己的本地配置
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/book_db?useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=请填写你的数据库密码

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=edu.hou.cache.bean
mybatis.configuration.map-underscore-to-camel-case=true

# Redis 配置 —— 请改成你自己的 Redis 地址
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
